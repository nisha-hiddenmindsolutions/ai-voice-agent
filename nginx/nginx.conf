# ==============================================================================
# nginx.conf — Production configuration for Voice AI SaaS
# Handles: SSL termination, gzip, rate limiting, WebSocket proxying,
#          security headers, and static asset caching.
# ==============================================================================

# Number of worker processes — auto = one per CPU core
worker_processes auto;

# Maximum open file descriptors per worker (connections + static files)
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # Max simultaneous connections per worker
    worker_connections 4096;
    # Accept multiple connections at once (better throughput)
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ── Performance ────────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;   # Hide nginx version from headers

    # ── Gzip Compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ── Rate Limiting ──────────────────────────────────────────────────────────
    # Shared memory zones (10MB holds ~160k IP states)
    limit_req_zone  $binary_remote_addr zone=api_limit:10m    rate=30r/m;   # API calls
    limit_req_zone  $binary_remote_addr zone=auth_limit:10m   rate=10r/m;   # Auth endpoints (strict)
    limit_req_zone  $binary_remote_addr zone=ws_limit:10m     rate=5r/m;    # WebSocket upgrades
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;                # Concurrent connections

    # ── Upstream ───────────────────────────────────────────────────────────────
    upstream app_backend {
        server app:8000;
        keepalive 32;   # Keep connections warm to FastAPI
    }

    # ── HTTP → HTTPS Redirect ──────────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Allow Let's Encrypt ACME challenge (certbot webroot method)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main HTTPS Server ──────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name ${DOMAIN};   # Replaced by envsubst at container start

        # ── SSL ──────────────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Modern TLS only (drops IE11 and old Android — acceptable for a SaaS)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        # OCSP stapling (speeds up TLS handshake for clients)
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/nginx/ssl/fullchain.pem;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # Session cache (improves reconnect performance)
        ssl_session_cache   shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # DH params (generate once: openssl dhparam -out nginx/ssl/dhparam.pem 2048)
        ssl_dhparam /etc/nginx/ssl/dhparam.pem;

        # ── Security Headers ────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "SAMEORIGIN"                                   always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header X-XSS-Protection          "1; mode=block"                                always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header Permissions-Policy        "geophone=(), microphone=(self), camera=()"    always;
        add_header Content-Security-Policy
            "default-src 'self'; \
             script-src 'self' 'unsafe-inline' 'unsafe-eval'; \
             style-src 'self' 'unsafe-inline'; \
             img-src 'self' data: blob:; \
             media-src 'self' blob:; \
             connect-src 'self' wss: https:; \
             font-src 'self' data:; \
             frame-ancestors 'none';" always;

        # ── Connection Limits ───────────────────────────────────────────────
        limit_conn conn_limit 20;   # Max 20 concurrent connections per IP

        # ── Client Settings ─────────────────────────────────────────────────
        client_max_body_size    50M;    # Allow file uploads up to 50MB
        client_body_timeout     30s;
        client_header_timeout   15s;
        send_timeout            30s;

        # ── Auth Endpoints (strict rate limit) ──────────────────────────────
        location ~ ^/api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── API Endpoints ────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass          http://app_backend;
            proxy_http_version  1.1;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_set_header    Connection        "";

            # Longer timeout for AI inference calls
            proxy_read_timeout  120s;
            proxy_send_timeout  30s;
            proxy_connect_timeout 10s;
        }

        # ── WebSocket (LiveKit voice agent signaling) ─────────────────────────
        location /ws/ {
            limit_req zone=ws_limit burst=3 nodelay;

            proxy_pass          http://app_backend;
            proxy_http_version  1.1;

            # Required for WebSocket upgrade
            proxy_set_header    Upgrade           $http_upgrade;
            proxy_set_header    Connection        "upgrade";
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;

            # WebSocket connections can be long-lived
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;

            # No buffering for real-time audio streams
            proxy_buffering     off;
        }

        # ── Health Check (no rate limit, no logging) ──────────────────────────
        location /health {
            access_log off;
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ── Static Frontend Assets (cache aggressively) ───────────────────────
        # Vite puts hashed filenames in /assets/ so they're safe to cache forever
        location /assets/ {
            proxy_pass          http://app_backend;
            proxy_http_version  1.1;
            proxy_set_header    Connection "";

            # Cache hashed static files for 1 year (cache busting via filename hash)
            proxy_cache_valid  200 1y;
            add_header         Cache-Control "public, max-age=31536000, immutable";
            expires            1y;
        }

        # ── SPA Fallback (React Router) ───────────────────────────────────────
        # All other requests go to the FastAPI app which serves index.html
        location / {
            proxy_pass          http://app_backend;
            proxy_http_version  1.1;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_set_header    Connection        "";

            # Don't cache the HTML shell (ensures React Router gets latest index.html)
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ── Custom Error Pages ─────────────────────────────────────────────────
        error_page 429 /429.json;
        location = /429.json {
            internal;
            default_type application/json;
            return 429 '{"error":"Too many requests","message":"Rate limit exceeded. Please slow down."}';
        }

        error_page 502 503 504 /50x.json;
        location = /50x.json {
            internal;
            default_type application/json;
            return 502 '{"error":"Service unavailable","message":"The server is temporarily unavailable. Please try again shortly."}';
        }
    }
}